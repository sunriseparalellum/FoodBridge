<div class="auth-shell">
    <div class="card">
        <h3>Сменить пароль</h3>
        <div class="field"><label>Текущий пароль</label><input [(ngModel)]="oldPassword" type="password" name="oldPassword" /></div>
        <div class="field"><label>Новый пароль</label><input [(ngModel)]="newPassword" type="password" name="newPassword" /></div>
        <div class="field"><label>Повторите новый пароль</label><input [(ngModel)]="confirmPassword" type="password" name="confirmPassword" /></div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" (click)="submit()">Сменить пароль</button>

        @if (success()) {
        
            <p style="color: var(--color-teal-dark); margin-top: 8px;">Пароль успешно изменён</p>
        }
        @if (error()) {
            <p style="color: var(--color-danger); margin-top: 8px;">{{ error() }}</p>
        }
    </div>
</div>
